[project]
name = "school-bd"
version = "0.1.0"
description = "SQLite student CRUD CLI and web UI built with SQLModel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.20",
    "rich>=15.0.0",
    "sqlmodel>=0.0.22",
    "typer>=0.27.3",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
