[project]
name = "school-bd"
version = "0.1.0"
description = "SQLite student CRUD CLI built with SQLModel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
    "sqlmodel>=0.0.22",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
