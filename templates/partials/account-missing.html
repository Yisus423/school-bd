{# Shown when an account action names an account that does not exist. #}
<dialog id="account-missing" aria-labelledby="account-missing-title">
  <h5 id="account-missing-title">Account not found</h5>
  <p>The account you asked for does not exist.</p>
  <nav>
    <button type="button" class="transparent" data-close>Close</button>
  </nav>
</dialog>
