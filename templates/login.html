<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · {{ settings.name }}</title>
  {# Root-relative asset paths: they survive proxies and keep the page offline. #}
  <link rel="stylesheet" href="/static/vendor/beer.min.css?v={{ asset_version('vendor/beer.min.css') }}">
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version('app.css') }}">
  <link rel="icon" href="/static/{{ settings.logo }}">
</head>
<body data-theme-source="{{ settings.theme_source }}" data-theme-fallback="{{ settings.color }}">
  <a class="skip" href="#main">Skip to content</a>

  <header>
    <nav>
      <img class="circle" src="/static/{{ settings.logo }}"
           alt="{{ settings.name }} logo" width="40" height="40">
      <h5 class="max">{{ settings.name }}</h5>
    </nav>
  </header>

  <main id="main" class="responsive max">
    <article class="border round">
      <h5>Sign in</h5>
      {% if failed %}
      {# One message for both halves: the page never says which one was wrong. #}
      <p id="sign-in-error" role="alert">
        The username or the password is not correct.
      </p>
      {% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="field label border round">
          <input id="username" name="username" value="{{ username }}" autocomplete="username"
                 required{% if failed %} aria-describedby="sign-in-error"{% endif %}>
          <label for="username">Username</label>
        </div>
        <div class="field label border round">
          <input id="password" name="password" type="password" autocomplete="current-password"
                 required{% if failed %} aria-describedby="sign-in-error"{% endif %}>
      <button type="button" class="reveal" data-reveal="password" aria-pressed="false" aria-label="Show password"><svg data-state="off" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 5c-5 0-9.3 3.1-11 7.5C2.7 16.9 7 20 12 20s9.3-3.1 11-7.5C21.3 8.1 17 5 12 5Zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg><svg data-state="on" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden><path fill="currentColor" d="M2.4 3.8 21.6 23l1.4-1.4L3.8 2.4 2.4 3.8ZM12 5c5 0 9.3 3.1 11 7.5a13.6 13.6 0 0 1-3.5 4.9l-1.5-1.5A11.6 11.6 0 0 0 20.9 12.5C19.2 8.8 15.8 7 12 7c-.9 0-1.8.1-2.6.4L7.7 5.7C9 5.3 10.5 5 12 5ZM7.5 9.5l1.6 1.6a3 3 0 0 0 3.8 3.8l1.6 1.6a5 5 0 0 1-7-7Z"/></svg></button>
          <label for="password">Password</label>
        </div>
        <nav>
          <button type="submit">Sign in</button>
        </nav>
      </form>
    </article>
  </main>

  <footer>
    <nav>{{ settings.name }}</nav>
  </footer>

  <script type="module" src="/static/app.js?v={{ asset_version('app.js') }}"></script>
</body>
</html>
